```html
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="planner">

    <!-- РАСТЕНИЯ СВЕРХУ -->
    <div class="plants">

        <div class="plant left">
            <div class="stem"></div>

            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
        </div>

        <div class="plant center">
            <div class="stem"></div>

            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
        </div>

        <div class="plant right">
            <div class="stem"></div>

            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
        </div>

    </div>


    <!-- ЗАГОЛОВОК -->
    <h1 class="title">
        Task Planner
    </h1>

    <div class="subtitle">
        Організуй свій день ✨
    </div>


    <!-- ДОСКА -->
    <div class="board">

        <!-- ПРОГРЕСС -->
        <div class="progress-container">
            <div class="progress-text">
                Прогрес: <span id="progressPercent">0%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>


        <div class="note blue">
            <b>Stay creative</b>

            <p>
                ────────
            </p>
        </div>

        <div class="note pink">
            <b>smile :)</b>

            <p>
                ♡
            </p>
        </div>

        <div class="note yellow">
            <b>TODAY:</b>

            <p>
                – sketch<br>
                – water plants
            </p>
        </div>

        <div class="note green"></div>

    </div>


    <!-- ДОБАВЛЕНИЕ ЗАДАЧИ -->
    <div class="task-input">

        <input
            type="text"
            id="taskInput"
            placeholder="+ Додати завдання..."
        >

        <button id="addButton">
            Додати
        </button>

    </div>


    <!-- НИЖНЯЯ ПОЛКА -->
    <div class="shelf">

        <div class="books">
            <div class="book one"></div>
            <div class="book two"></div>
            <div class="book three"></div>
        </div>

        <div class="pot"></div>

        <div class="small-leaf"></div>

        <div class="camera"></div>

        <div class="triangle"></div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
```
